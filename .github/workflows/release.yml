name: Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build executables and WinGet manifests
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: ./scripts/Build-Release.ps1 -Tag $env:RELEASE_TAG -Repository $env:RELEASE_REPOSITORY
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = (Get-ChildItem artifacts/release -File).FullName
          gh release create $env:RELEASE_TAG @assets --verify-tag --generate-notes --title "JackOfAll $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }

  winget:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check WinGet token
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -z "$WINGET_TOKEN" ]; then
            echo '::error::Add the WINGET_TOKEN repository secret with public_repo and workflow scopes.'
            exit 1
          fi
      - name: Submit WinGet update
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: Pienteger.JackOfAll
          installers-regex: '^JackOfAll-win-(x64|arm64)\.exe$'
          release-tag: ${{ github.ref_name }}
          fork-user: ${{ vars.WINGET_FORK_USER || 'MahmudX' }}
          token: ${{ secrets.WINGET_TOKEN }}
